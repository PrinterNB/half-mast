<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Half-Mast Notices</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="page-header">
        <h1>Half-Mast Notices</h1>
        <p>Current flag status, reason, and duration.</p>
      </header>

      <section class="notice notice--nationwide" id="nationwide-notice">
        <h2>Nationwide Notice</h2>
        <p class="status">Loading</p>
        <p><strong>Why:</strong> Loading notice details...</p>
        <p><strong>How long:</strong> Loading notice details...</p>
      </section>

      <section class="notice-list">
        <h2>State Notices</h2>
        <div class="state-cards" id="state-cards">
          <p>Loading state notices...</p>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
